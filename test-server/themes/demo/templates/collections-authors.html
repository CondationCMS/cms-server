<!DOCTYPE html SYSTEM>
<html xmlns="http://www.w3.org/1999/xhtml">

	<head>
		
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		
		{% include "libs/fragments.html" %}
		
		
	</head>

	<body class="centered">

		<div id="content"  >
			<div class="container">
				{{ node.content | raw }}
			</div>

			<h2>Remote author collection</h2>
			{% assign items = cms.collection("authors").query().get() %}
			
			{% for item in items %}
				<div class="container" {{ ext.ui.collectionToolbar(item, ["editCollectionItem"]) | raw }}>
					<a href="{{ cms.links.collectionUrl(item) }}">{{ item.meta.title | raw }}</a>
				</div>
			{% endfor %}
		</div>

	</body>


</html>
