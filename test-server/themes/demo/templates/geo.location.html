<!DOCTYPE html SYSTEM>
<html xmlns="http://www.w3.org/1999/xhtml">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		{% include "libs/fragments.html" %}
	</head>
	<body class="centered">
		<div class="container">
			<p><a href="/locations">Back to radius search</a></p>
			<h1>{{ node.meta.get('title') }}</h1>
			{{ node.content | raw }}
			<p>
				Coordinates:
				{{ node.meta.get('location.latitude') }},
				{{ node.meta.get('location.longitude') }}
			</p>
		</div>
	</body>
</html>
