{% if MANAGER %}
  <h2>running in manager</h2>
{% endif %}
{% if PREVIEW_MODE %}
  <h2>running in preview</h2>
{% endif %}
<div class="language-buttons">
  {% for alternate in node.alternates.entries() %}
  <a href="{{ alternate.url() }}" class="lang {% if alternate.current() %}active{% endif %}">
    <img src="https://flagcdn.com/w20/{{ alternate.country() }}.png" width="20" height="15" alt="{{ alternate.locale() }}">
  </a>
  {% endfor %}
</div>
