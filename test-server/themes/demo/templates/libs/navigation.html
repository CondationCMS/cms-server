{% assign nodes = cms.navigation.list(node.properties["url"]) %}
<ul style="list-style-type: none;">
  {% for node in nodes %}
    <li><a href="{{ node.path }}">{{ node.name }}</a></li>
  {% endfor %}
</ul>

<!-- example for menu-->
{% assign mainMenu = cms.menu("main") %}
<ul style="list-style-type: none;">
{% for item in mainMenu.items() %}
  {% if item.enabled %}
    <li><a href="{{ item.url }}">{{ item.label }}</a></li>
  {% endif %}
{% endfor %}
</ul>
